plugins {
    id 'java'
}

group = 'org.joom'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.appium:java-client:11.0.0'
    // java-client accepts any Selenium in [4.50, 5.0); pinning it keeps Selenium upgrades deliberate.
    implementation 'org.seleniumhq.selenium:selenium-support:4.51.0'

    implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    implementation 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

tasks.named('test') {
    useJUnitPlatform {
        if (System.getenv('CI')) {
            includeTags 'acceptanceTest'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
