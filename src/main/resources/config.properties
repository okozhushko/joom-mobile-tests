# Which Appium backend to use is chosen by the APPIUM_TARGET environment variable: local (default) or browserstack.

app.package=com.joom
app.activity=com.joom.ui.main.MainActivity
new.command.timeout.seconds=120
wait.timeout.seconds=10

# Local Appium server with an Android emulator
local.server.url=http://127.0.0.1:4723/
local.device.name=Android Emulator

# BrowserStack. Credentials are read from the BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY environment variables.
browserstack.server.url=https://hub-cloud.browserstack.com/wd/hub
browserstack.device.name=Samsung Galaxy S21
browserstack.os.version=11
browserstack.app=bs://c31154cd8b8e71e8cd3b4e602122afe0901451ba
browserstack.project=joom-mobile-tests
